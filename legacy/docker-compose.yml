version: '3.9'

services:

  # ── Postgres ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16
    container_name: zfm_postgres
    environment:
      POSTGRES_USER: zfm_user
      POSTGRES_PASSWORD: zfm_secret
      POSTGRES_DB: zero_fraud_matrimony
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zfm_user -d zero_fraud_matrimony"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── FastAPI core ──────────────────────────────────────────────────────────
  backend-core:
    build: ./backend-core
    container_name: zfm_backend_core
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://zfm_user:zfm_secret@db:5432/zero_fraud_matrimony
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      DEV_MODE: ${DEV_MODE:-false}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ── Socket.io chat ────────────────────────────────────────────────────────
  backend-chat:
    build: ./backend-chat
    container_name: zfm_backend_chat
    ports:
      - "3001:3001"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FASTAPI_BASE: http://backend-core:8000
    depends_on:
      - backend-core
    restart: unless-stopped

volumes:
  postgres_data:
